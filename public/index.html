<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- title/description are set from admin-configured brand config via applyBrandConfig() on load -->
<title>Perennia</title>
<meta name="description" content="">
<script>
// Set the correct lang/dir before first paint — avoids a flash of
// English/LTR for a returning Arabic user or an Arabic-locale browser.
// Kept in sync with getInitialLang() further down in the page script.
(function () {
  try {
    var l = null;
    try { var saved = localStorage.getItem('perennia_lang'); if (saved === 'en' || saved === 'ar') l = saved; } catch (e) {}
    if (!l) {
      var nav = ((navigator.language || (navigator.languages && navigator.languages[0]) || '') + '').toLowerCase();
      l = nav.indexOf('ar') === 0 ? 'ar' : 'en';
    }
    if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
  } catch (e) { /* default en/ltr already set in markup */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Noto+Kufi+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }

/* ── Keyboard focus visibility ──
   Buttons/pills/chips/slots have their own hover treatments but no
   :focus style, so keyboard users tabbing through them get no visible
   indicator of where focus is. This adds one consistent ring, shown
   only for keyboard focus (:focus-visible) so mouse clicks stay clean. */
button:focus-visible, a:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}

:root {
  /* ── Exact colors sampled from official Perennia logos ── */
  --navy-1: #000e28;
  --navy-2: #001030;
  --navy-3: #041a3e;
  --navy-4: #05214b;
  --navy-5: #0a2d5e;
  --navy-6: #123870;
  --blue-mid: #1e4d8c;
  --blue-light: #2d6aad;
  --white-soft: #e8eef8;
  --white-pure: #ffffff;
  --gold: #d0a030;
  --gold-dim: rgba(208,160,48,0.16);
  --gold-border: rgba(208,160,48,0.30);
  --glass: rgba(255,255,255,0.055);
  --glass-border: rgba(255,255,255,0.10);
  --muted: rgba(255,255,255,0.50);
  --font-en-display: 'Cormorant Garamond', Georgia, serif;
  --font-en: 'Inter', system-ui, sans-serif;
  --font-ar: 'Noto Kufi Arabic', 'Arial Unicode MS', sans-serif;
}

body {
  min-height: 100%;
  font-family: var(--font-en);
  /* Multi-stop gradient: deep navy → mid-blue → lighter blue → white-ish — the "rich blue" base of the whole app */
  background:
    radial-gradient(ellipse 100% 55% at 50% -5%, rgba(208,160,48,0.10) 0%, transparent 55%),
    radial-gradient(ellipse 70% 70% at 15% 85%, rgba(4,26,62,0.95) 0%, transparent 55%),
    radial-gradient(ellipse 70% 70% at 88% 15%, rgba(18,56,112,0.35) 0%, transparent 50%),
    linear-gradient(160deg,
      var(--navy-1) 0%,
      var(--navy-2) 15%,
      var(--navy-3) 32%,
      var(--navy-4) 50%,
      var(--navy-5) 66%,
      var(--navy-6) 78%,
      #1e4d8c 88%,
      #3a6eb8 100%
    );
  background-attachment: fixed;
  color: #fff;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* ── Mesh overlay for depth ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.022) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.022) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 90% 90% at 50% 40%, black 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* ── Top bar (shared look for lang / nav pills) ── */
.top-bar {
  position: fixed;
  top: 20px;
  right: 20px;
  left: 20px;
  z-index: 200;
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  transition: right 0.3s, left 0.3s;
}
[dir="rtl"] .top-bar { justify-content: flex-start; }
@media (max-width: 640px) {
  .top-bar { top: 12px; right: 12px; left: 12px; gap: 6px; }
}
@media (max-width: 380px) {
  /* Narrow/older devices: three pills (Our Work / Contact Us / language)
     won't fit on one row at normal size — shrink rather than clip or
     overflow off-screen. flex-wrap above still applies as a fallback if
     the user has increased their OS text size. */
  .lang-btn, .nav-pill { font-size: 10.5px; padding: 6px 12px; }
}

.icon-btn, .lang-btn, .nav-pill {
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.7);
  font-family: var(--font-en);
  cursor: pointer;
  backdrop-filter: blur(16px);
  transition: all 0.2s ease;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:hover, .lang-btn:hover, .nav-pill:hover { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }

.icon-btn { font-size: 14px; width: 34px; height: 34px; border-radius: 100px; }
.lang-btn, .nav-pill {
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  padding: 7px 18px;
  border-radius: 100px;
  white-space: nowrap;
}

/* ── Nav-link content panel: these top-bar items ("Our Work", "Contact
   Us", etc.) used to be teasers that sent visitors off to a separate
   page. They're first-class internal content now — same overlay
   philosophy as the booking panel (dimmed backdrop, centered card, gold
   accents), just carrying whatever the admin has written for that link,
   in full, without ever leaving the app. ── */
.nav-preview-backdrop {
  position: fixed; inset: 0; z-index: 210;
  background: rgba(4,12,28,0.6); backdrop-filter: blur(3px);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.22s ease;
}
.nav-preview-backdrop.open { opacity: 1; visibility: visible; pointer-events: auto; }
.nav-preview-card {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%);
  z-index: 211; width: min(560px, calc(100vw - 48px)); max-height: min(78vh, 640px);
  overflow-y: auto;
  background: linear-gradient(160deg, rgba(255,255,255,0.1) 0%, rgba(107,170,232,0.08) 45%, rgba(4,26,62,0.85) 100%), var(--navy-2);
  border: 1px solid rgba(201,162,39,0.28);
  border-radius: 16px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.45);
  padding: 30px 30px 26px;
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity 0.22s ease, transform 0.22s ease;
}
.nav-preview-backdrop.open .nav-preview-card { opacity: 1; visibility: visible; pointer-events: auto; transform: translate(-50%, -50%); }
.nav-preview-title { font-family: var(--font-en-display); font-size: 21px; font-weight: 600; color: var(--gold); margin-bottom: 14px; }
[dir="rtl"] .nav-preview-title { font-family: var(--font-ar); font-weight: 500; }
.nav-preview-body { font-size: 14px; line-height: 1.8; color: rgba(255,255,255,0.85); white-space: pre-line; }
.nav-preview-visit {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 20px;
  background: var(--gold-dim); border: 1px solid var(--gold-border); color: var(--gold);
  font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-decoration: none;
  padding: 8px 16px; border-radius: 100px;
}
.nav-preview-close {
  position: absolute; top: 14px; right: 16px; background: none; border: none;
  color: rgba(255,255,255,0.5); font-size: 18px; cursor: pointer; line-height: 1;
}
[dir="rtl"] .nav-preview-close { right: auto; left: 16px; }
[dir="rtl"] .nav-preview-visit { flex-direction: row-reverse; }

/* ── Wordmark fallback (shown if the admin hasn't uploaded a logo yet) ── */
.wordmark {
  display: none;
  font-family: var(--font-en-display);
  font-size: 30px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: #fff;
}
.wordmark .g { color: var(--gold); }
[dir="rtl"] .wordmark { font-family: var(--font-ar); letter-spacing: 0; }

/* ── LOGO ── */
.logo-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.logo-wrap::before {
  content: '';
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 200px; height: 100px;
  background: radial-gradient(ellipse, rgba(208,160,48,0.08) 0%, transparent 70%);
  pointer-events: none;
}
.logo-img {
  height: 60px;
  width: auto;
  max-width: 320px;
  display: block;
  position: relative;
  z-index: 1;
  filter: drop-shadow(0 2px 24px rgba(208,160,48,0.20));
  transition: filter 0.4s ease;
}
.logo-img:hover { filter: drop-shadow(0 2px 36px rgba(208,160,48,0.38)); }

/* ── Tagline (shared style) ── */
.tagline-wrap { text-align: center; width: 100%; }
.tagline-main {
  font-family: var(--font-en-display);
  font-size: clamp(1.55rem, 3.2vw, 2.3rem);
  font-weight: 600;
  color: #ffffff;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
[dir="rtl"] .tagline-main { font-family: var(--font-ar); font-weight: 500; }
.tagline-main .gold { color: var(--gold); }

.tagline-divider {
  width: 44px; height: 1.5px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 12px auto;
}

.tagline-sub {
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.42);
}
[dir="rtl"] .tagline-sub { letter-spacing: 0; }

/* ══════════════════════════════════════════════════════════
   HOME / LANDING PAGE
══════════════════════════════════════════════════════════ */
#home-page {
  position: relative;
  z-index: 1;
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: opacity 0.4s ease;
}
body.chat-active #home-page { display: none; }

.home-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 40px;
  padding: 100px 24px 60px;
  cursor: pointer;
  text-align: center;
}

.home-logo-wrap .logo-img { height: 100px; }
.home-logo-wrap .wordmark { font-size: 42px; }

.home-welcome {
  font-family: var(--font-en-display);
  font-size: clamp(2rem, 5vw, 3.1rem);
  font-weight: 600;
  color: #fff;
  line-height: 1.2;
}
[dir="rtl"] .home-welcome { font-family: var(--font-ar); font-weight: 500; }

.home-tagline {
  font-size: 15px;
  color: rgba(255,255,255,0.55);
  line-height: 1.6;
  max-width: 440px;
}

/* ── Glass "start chat" pill, pulsing gently ── */
.home-cta {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  padding: 14px 30px;
  border-radius: 100px;
  border: 1px solid var(--gold-border);
  background: linear-gradient(145deg, rgba(255,255,255,0.09), rgba(107,170,232,0.07));
  backdrop-filter: blur(20px);
  color: var(--gold);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.12);
  animation: ctaPulse 2.6s ease-in-out infinite;
  transition: transform 0.2s ease, background 0.2s ease;
}
.home-cta:hover { transform: translateY(-2px); background: var(--gold-dim); }
@keyframes ctaPulse {
  0%, 100% { box-shadow: 0 8px 30px rgba(208,160,48,0.10), inset 0 1px 0 rgba(255,255,255,0.12); }
  50% { box-shadow: 0 8px 34px rgba(208,160,48,0.32), inset 0 1px 0 rgba(255,255,255,0.18); }
}

/* ── Auto-transition progress bar under the CTA ── */
.progress-track {
  width: 160px;
  height: 3px;
  border-radius: 3px;
  background: rgba(255,255,255,0.10);
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  border-radius: 3px;
  background: linear-gradient(90deg, var(--gold), #f0c766);
}
.progress-fill.running { transition: width 7s linear; width: 100%; }

@media (prefers-reduced-motion: reduce) {
  .home-cta { animation: none; }
  .progress-fill.running { transition: none; width: 0%; }
  .progress-track { display: none; }
}

#home-footer {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 18px;
  font-size: 10.5px;
  color: rgba(255,255,255,0.5); /* was 0.2 — measured ~1.8:1 contrast against the navy background, well under WCAG AA's 4.5:1 for normal text; 0.5 measures ~5.2:1 */
  letter-spacing: 0.06em;
}

@media (max-width: 640px) {
  .home-center { padding: 90px 20px 40px; gap: 28px; }
  .home-logo-wrap .logo-img { height: 72px; }
}
@media (max-width: 380px) {
  .home-center { padding-top: 108px; } /* extra clearance in case the top-bar wraps to 2 rows */
}

/* ══════════════════════════════════════════════════════════
   CHAT PAGE (fixed overlay above the home page)
   Full-screen, chat window centered with FAQ + image panels
   flanking it — a real "app" layout, not a scrolling page.
══════════════════════════════════════════════════════════ */
#chat-page {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  flex-direction: column;
  opacity: 0;
  transform: scale(0.97);
  transition: opacity 0.4s ease, transform 0.4s ease;
  overflow-y: auto;
}
#chat-page.active { display: flex; opacity: 1; transform: scale(1); }

.chat-page-logo { position: fixed; top: 20px; left: 20px; z-index: 1001; }
[dir="rtl"] .chat-page-logo { left: auto; right: 20px; }
.chat-page-logo .logo-img { height: 104px; max-width: none; }
@media (max-width: 640px) {
  .chat-page-logo { top: 12px; left: 12px; }
  [dir="rtl"] .chat-page-logo { left: auto; right: 12px; }
  .chat-page-logo .logo-img { height: 84px; }
}

.back-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 150;
}
[dir="rtl"] .back-btn { left: auto; right: 20px; }

/* ── Main layout: everything centered as one block in the viewport ── */
main.chat-main {
  position: relative;
  z-index: 1;
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 88px 24px 24px;
  overflow-y: auto;
  gap: 22px;
}

.inner { width: 100%; max-width: 1360px; display: flex; flex-direction: column; align-items: center; gap: 22px; }

/* ── Content grid: FAQ | chat | images, all stretched to the same height, centered as a unit ── */
.content-wrapper {
  display: grid;
  grid-template-columns: 230px minmax(320px, 740px) 280px;
  gap: 26px;
  width: 100%;
  justify-content: center;
  height: min(70vh, 720px);
  min-height: 420px;
}
[dir="rtl"] .content-wrapper { direction: rtl; }

/* ── Image sidebar — cycles between the hero image and short philosophy
   quotes, whichever is available, in the same glass/gold language as the
   rest of the app ── */
.image-sidebar {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: 100%;
}
.slide-frame {
  position: relative;
  flex: 1;
  min-height: 0;
  border-radius: 18px;
  overflow: hidden;
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.25));
  transition: filter 0.3s ease;
}
.slide-frame:hover { filter: drop-shadow(0 12px 32px rgba(0,0,0,0.35)); }

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.7s ease;
}
.slide.active { opacity: 1; visibility: visible; }

.slide-img img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: center;
}
.slide-img .img-caption {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 20px 18px 16px;
  background: linear-gradient(0deg, rgba(0,10,30,0.78) 0%, rgba(0,10,30,0.25) 60%, transparent 100%);
  font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.88); text-align: center;
}

.slide-text {
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 30px 24px;
  background: linear-gradient(160deg, rgba(255,255,255,0.09) 0%, rgba(107,170,232,0.07) 45%, rgba(4,26,62,0.55) 100%), var(--navy-2);
  border: 1px solid rgba(255,255,255,0.12);
}
.quote-mark {
  font-family: var(--font-en-display); font-size: 58px; line-height: 1;
  color: var(--gold); opacity: 0.5; margin-bottom: 2px;
}
.quote-text {
  font-family: var(--font-en-display); font-style: italic; font-weight: 500;
  font-size: 19px; line-height: 1.5; color: rgba(255,255,255,0.94); max-width: 240px;
}
[dir="rtl"] .quote-text { font-family: var(--font-ar); font-style: normal; }
.quote-label {
  margin-top: 16px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--gold); opacity: 0.85;
}
[dir="rtl"] .quote-label { letter-spacing: 0; }

.slide-dots { display: flex; justify-content: center; gap: 6px; flex-shrink: 0; }
.slide-dot {
  width: 6px; height: 6px; border-radius: 50%; border: none; padding: 0;
  background: rgba(255,255,255,0.22); transition: all 0.25s ease; cursor: pointer;
}
.slide-dot:hover { background: rgba(255,255,255,0.4); }
.slide-dot.active { background: var(--gold); width: 18px; border-radius: 3px; box-shadow: 0 0 8px rgba(208,160,48,0.4); }

@media (max-width: 1180px) {
  .content-wrapper { grid-template-columns: 1fr; height: auto; }
  .image-sidebar { display: none; }
}

/* ── FAQ / Quick Questions sidebar — normal grid column, never overlaps anything ── */
.faq-sidebar {
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  background: linear-gradient(145deg, rgba(255,255,255,0.07) 0%, rgba(107,170,232,0.05) 50%, rgba(255,255,255,0.03) 100%);
  border: 1px solid rgba(255,255,255,0.12);
  box-shadow: 0 0 0 1px rgba(201,162,39,0.06), 0 8px 28px rgba(0,0,0,0.26), inset 0 1px 0 rgba(255,255,255,0.10);
  backdrop-filter: blur(24px);
  padding: 18px 15px;
  overflow-y: auto;
}

.faq-title { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold); margin-bottom: 14px; padding: 0 2px; flex-shrink: 0; }
[dir="rtl"] .faq-title { letter-spacing: 0; text-align: right; }

.faq-list { display: flex; flex-direction: column; gap: 9px; }
.faq-item {
  display: block; width: 100%; text-align: left;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 10px; color: rgba(255,255,255,0.75);
  font-family: inherit; font-size: 13.5px; line-height: 1.55; padding: 10px 12px;
  cursor: pointer; transition: all 0.18s ease; flex-shrink: 0;
}
[dir="rtl"] .faq-item { text-align: right; }
[dir="rtl"] .faq-item, [dir="rtl"] .faq-item * { font-family: var(--font-ar); }
.faq-item:hover { background: var(--gold-dim); border-color: var(--gold-border); color: #fff; }
.faq-item strong { color: var(--gold); font-weight: 600; }
.faq-item:hover strong { color: var(--gold); }
.faq-item:disabled { opacity: 0.45; cursor: not-allowed; }

@media (max-width: 1180px) {
  .faq-sidebar { width: 100%; height: auto; max-height: none; order: -1; }
  .faq-list { flex-direction: row; flex-wrap: wrap; }
  .faq-item { width: auto; flex: 1 1 auto; }
}

/* ── Chat shell — the centerpiece, full height of the content grid ── */
.chat-shell {
  min-width: 0;
  height: 100%;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  background: linear-gradient(145deg, rgba(255,255,255,0.08) 0%, rgba(107,170,232,0.06) 50%, rgba(255,255,255,0.04) 100%);
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: 0 0 0 1px rgba(201,162,39,0.07), 0 8px 32px rgba(0,0,0,0.30), 0 32px 80px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.12);
  backdrop-filter: blur(24px);
}

/* Chat header */
.chat-header {
  display: flex; align-items: center; gap: 11px; padding: 16px 22px; flex-shrink: 0;
  background: linear-gradient(90deg, rgba(255,255,255,0.04), rgba(107,170,232,0.05), rgba(255,255,255,0.03));
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,0.6); flex-shrink: 0; animation: pulse 2.5s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

.chat-header-text { font-size: 14.5px; color: rgba(255,255,255,0.55); font-weight: 400; letter-spacing: 0.01em; }
.chat-header-text b { color: var(--gold); font-weight: 600; }

.wa-btn {
  margin-left: auto; width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
  background: #25D366; color: #fff; display: flex; align-items: center; justify-content: center;
  transition: transform 0.18s ease, box-shadow 0.18s ease; box-shadow: 0 2px 10px rgba(37,211,102,0.25);
}
.wa-btn:hover { transform: scale(1.08); box-shadow: 0 3px 14px rgba(37,211,102,0.4); }
.wa-btn svg { width: 17px; height: 17px; }
[dir="rtl"] .wa-btn { margin-left: 0; margin-right: auto; }

/* Messages */
.chat-messages {
  flex: 1; min-height: 0; overflow-y: auto; padding: 24px 22px;
  display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
}
.chat-messages::-webkit-scrollbar { width: 6px; }
.chat-messages::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
.chat-messages::-webkit-scrollbar-thumb { background: rgba(201,162,39,0.35); border-radius: 3px; }
.chat-messages::-webkit-scrollbar-thumb:hover { background: rgba(201,162,39,0.55); }

.msg { display: flex; gap: 12px; align-items: flex-start; animation: msgIn 0.28s ease both; flex-shrink: 0; }
@keyframes msgIn { from{opacity:0;transform:translateY(7px)} to{opacity:1;transform:translateY(0)} }
.msg.user { flex-direction: row-reverse; }
[dir="rtl"] .msg.ai  { flex-direction: row-reverse; }
[dir="rtl"] .msg.user { flex-direction: row; }

.avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; font-weight: 700; margin-top: 2px; }
.msg.ai .avatar { background: linear-gradient(135deg, var(--navy-3), var(--navy-5)); border: 1px solid var(--gold-border); color: var(--gold); font-family: var(--font-en-display); font-size: 18px; box-shadow: 0 0 14px rgba(208,160,48,0.18); }
.msg.user .avatar { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.6); font-size: 12px; }

.bubble { max-width: 82%; padding: 13px 17px; border-radius: 16px; font-size: 16px; line-height: 1.72; }
.msg.ai .bubble { background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(107,170,232,0.07)); border: 1px solid rgba(255,255,255,0.09); color: rgba(255,255,255,0.92); border-bottom-left-radius: 4px; }
[dir="rtl"] .msg.ai .bubble { border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
.msg.user .bubble { background: linear-gradient(135deg, var(--gold), #b8881a); color: #fff; font-weight: 500; border-bottom-right-radius: 4px; }
[dir="rtl"] .msg.user .bubble { border-bottom-right-radius: 16px; border-bottom-left-radius: 4px; }

/* Typing dots */
.typing-bubble { display: flex; gap: 5px; padding: 14px 17px; background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(107,170,232,0.07)); border: 1px solid rgba(255,255,255,0.09); border-radius: 16px; border-bottom-left-radius: 4px; }
[dir="rtl"] .typing-bubble { border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
.typing-bubble span { width: 6px; height: 6px; background: rgba(201,162,39,0.65); border-radius: 50%; animation: bounce 1.1s ease-in-out infinite; }
.typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
.typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:.45} 30%{transform:translateY(-5px);opacity:1} }

/* Chips */
.chips { padding: 0 20px 14px; display: flex; gap: 7px; flex-wrap: wrap; flex-shrink: 0; }
.chip {
  font-size: 12.5px; padding: 6px 14px; background: transparent;
  border: 1px solid rgba(201,162,39,0.28); border-radius: 100px; color: rgba(255,255,255,0.55);
  cursor: pointer; font-family: inherit; transition: all 0.18s ease; white-space: nowrap;
}
.chip:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--gold); }

/* Input area */
.chat-input-area { display: flex; gap: 10px; align-items: flex-end; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.07); background: linear-gradient(90deg, rgba(0,0,0,0.10), rgba(15,32,64,0.15)); flex-shrink: 0; }

.chat-input {
  flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.11);
  border-radius: 10px; color: #fff; font-family: inherit; font-size: 16px; line-height: 1.5;
  padding: 11px 15px; resize: none; min-height: 46px; max-height: 130px; outline: none; transition: border-color 0.2s;
}
[dir="rtl"] .chat-input { text-align: right; font-family: var(--font-ar); }
.chat-input::placeholder { color: rgba(255,255,255,0.28); }
.chat-input:focus { border-color: rgba(201,162,39,0.45); }

.send-btn {
  width: 46px; height: 46px; flex-shrink: 0; border-radius: 10px; background: var(--gold);
  border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;
}
.send-btn:hover:not(:disabled) { background: #b8881a; transform: scale(1.05); }
.send-btn:disabled { background: rgba(201,162,39,0.25); cursor: not-allowed; transform: none; }
.send-btn svg { width: 18px; height: 18px; }

/* ── Chat footer ── */
.chat-footer {
  position: relative; z-index: 1; text-align: center; padding: 6px 18px 14px;
  font-size: 10.5px; color: rgba(255,255,255,0.2); letter-spacing: 0.06em; flex-shrink: 0;
}

/* ── Responsive ── */
@media (max-width: 1180px) {
  main.chat-main { padding: 84px 20px 20px; }
  .content-wrapper { gap: 16px; }
  .chat-shell { height: min(74vh, 680px); }
}
@media (max-width: 640px) {
  main.chat-main { padding: 68px 12px 12px; }
  .inner { gap: 14px; }
  .tagline-wrap { margin-top: 0 !important; }
  .content-wrapper { gap: 12px; height: auto; }
  .chat-shell { height: calc(100vh - 150px); min-height: 380px; }
  .faq-list { gap: 6px; }
  .faq-item { font-size: 12.5px; padding: 8px 10px; }
  .bubble { font-size: 15px; max-width: 88%; }
  .avatar { width: 30px; height: 30px; font-size: 13px; }
}

/* ── Appointment CTA button (inside chat bubbles) ── */
.cta-row { margin-top: 10px; }
.cta-btn {
  font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: 100px;
  border: 1px solid var(--gold-border); background: var(--gold-dim); color: var(--gold);
  cursor: pointer; font-family: inherit; transition: all 0.18s ease; display: inline-flex; align-items: center; gap: 6px;
}
.cta-btn:hover { background: var(--gold); color: #fff; }

/* ── Talk to Us — lives inside the chat shell, not a separate overlay ── */
.chat-conversation-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}
.chat-conversation {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.booking-panel {
  position: absolute; inset: 0; z-index: 20;
  display: flex; flex-direction: column;
  background: linear-gradient(160deg, rgba(255,255,255,0.09) 0%, rgba(107,170,232,0.07) 45%, rgba(4,26,62,0.55) 100%), var(--navy-2);
  backdrop-filter: blur(20px);
  padding: 22px 24px 20px;
  overflow-y: auto;
  opacity: 0; transform: translateY(14px); visibility: hidden; pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
}
.booking-panel.open { opacity: 1; transform: translateY(0); visibility: visible; pointer-events: auto; }

.booking-panel::before {
  content: '';
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 140px; height: 100px;
  background: radial-gradient(ellipse, rgba(208,160,48,0.14) 0%, transparent 70%);
  pointer-events: none;
}

.booking-close {
  position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 100px;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.13);
  color: rgba(255,255,255,0.55); font-size: 13px; cursor: pointer; line-height: 1;
  display: flex; align-items: center; justify-content: center; transition: all 0.18s ease;
  z-index: 1;
}
.booking-close:hover { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }
[dir="rtl"] .booking-close { right: auto; left: 16px; }

.booking-badge {
  width: 44px; height: 44px; border-radius: 50%; margin-bottom: 12px;
  background: linear-gradient(135deg, var(--navy-3), var(--navy-5));
  border: 1px solid var(--gold-border); color: var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 19px;
  box-shadow: 0 0 16px rgba(208,160,48,0.20);
}

.booking-panel h3 { font-family: var(--font-en-display); font-size: 23px; color: #fff; font-weight: 600; margin-bottom: 5px; letter-spacing: -0.01em; }
[dir="rtl"] .booking-panel h3 { font-family: var(--font-ar); font-weight: 500; }
.booking-panel > p { font-size: 12.5px; color: rgba(255,255,255,0.52); margin-bottom: 6px; line-height: 1.55; }

.booking-head-divider {
  width: 40px; height: 1.5px;
  background: linear-gradient(90deg, var(--gold), transparent);
  margin: 4px 0 16px;
}
[dir="rtl"] .booking-head-divider { background: linear-gradient(90deg, transparent, var(--gold)); margin-left: auto; }

/* Tabs: New Appointment / Manage Booking */
.bk-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-shrink: 0; }
.bk-tab {
  flex: 1; padding: 9px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
  background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.11); color: rgba(255,255,255,0.55);
  cursor: pointer; font-family: inherit; transition: all 0.18s ease; text-align: center;
}
.bk-tab:hover { color: rgba(255,255,255,0.8); }
.bk-tab.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }

.bk-field { margin-bottom: 14px; }
.bk-field label { display: block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.10em; color: var(--gold); margin-bottom: 6px; text-transform: uppercase; opacity: 0.85; }
[dir="rtl"] .bk-field label { letter-spacing: 0; }
.bk-field input, .bk-field textarea {
  width: 100%; background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.13);
  border-radius: 10px; color: #fff; font-family: inherit; font-size: 14.5px; padding: 10px 13px; outline: none; resize: vertical;
  transition: border-color 0.2s, background 0.2s;
}
.bk-field input::placeholder, .bk-field textarea::placeholder { color: rgba(255,255,255,0.28); }
.bk-field input:focus, .bk-field textarea:focus { border-color: rgba(201,162,39,0.55); background: rgba(255,255,255,0.08); }
.bk-field input[type="date"] { color-scheme: dark; }

.bk-slots { display: flex; flex-wrap: wrap; gap: 7px; max-height: 150px; overflow-y: auto; padding: 2px; }
.bk-slots-empty { font-size: 12.5px; color: rgba(255,255,255,0.38); padding: 6px 2px; font-style: italic; font-family: var(--font-en-display); }
.bk-slot {
  font-size: 12.5px; padding: 7px 13px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.13);
  background: rgba(255,255,255,0.045); color: rgba(255,255,255,0.75); cursor: pointer; font-family: inherit;
  transition: all 0.18s ease;
}
.bk-slot:hover { border-color: var(--gold-border); color: var(--gold); background: var(--gold-dim); }
.bk-slot.picked { background: var(--gold); border-color: var(--gold); color: #1a1305; font-weight: 700; box-shadow: 0 0 14px rgba(208,160,48,0.35); }

.bk-err { font-size: 12px; color: #e0785f; min-height: 16px; margin-top: 2px; }

/* Appointment summary card + notice banner (Manage Booking) */
.bk-appt-summary {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.11); border-radius: 12px;
  padding: 14px 16px; margin-bottom: 12px; font-size: 13.5px; line-height: 1.7; color: rgba(255,255,255,0.85);
}
.bk-appt-summary b { color: var(--gold); }
.bk-appt-summary .appt-id { font-family: var(--font-en-display); font-size: 16px; color: #fff; font-weight: 600; }
.bk-appt-summary .appt-status-cancelled { color: #e0785f; font-weight: 600; }

.bk-notice {
  font-size: 12.5px; line-height: 1.55; padding: 10px 13px; border-radius: 10px; margin-bottom: 12px;
  background: rgba(224,120,95,0.12); border: 1px solid rgba(224,120,95,0.30); color: #f0a68f;
}

.booking-foot { display: flex; gap: 10px; margin-top: 10px; }
.btn-2 {
  flex: 1; padding: 11px; border-radius: 10px; font-size: 13.5px; font-weight: 600;
  background: rgba(255,255,255,0.055); border: 1px solid rgba(255,255,255,0.14); color: rgba(255,255,255,0.7);
  cursor: pointer; font-family: inherit; transition: all 0.18s ease;
}
.btn-2:hover { background: rgba(255,255,255,0.09); }
.btn-2:disabled { opacity: 0.45; cursor: not-allowed; }
.send-btn-wide {
  flex: 1.4; padding: 11px; border-radius: 10px; font-size: 13.5px; font-weight: 700;
  background: linear-gradient(135deg, var(--gold), #b8881a); border: none; color: #fff; cursor: pointer; font-family: inherit;
  box-shadow: 0 4px 16px rgba(208,160,48,0.25); transition: all 0.18s ease;
}
.send-btn-wide:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(208,160,48,0.35); }
.send-btn-wide:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

.booking-success { text-align: center; padding: 20px 4px 4px; }
.bk-success-icon {
  width: 50px; height: 50px; border-radius: 50%; margin: 0 auto 14px;
  background: linear-gradient(135deg, var(--navy-3), var(--navy-5));
  border: 1px solid var(--gold-border); color: var(--gold);
  display: flex; align-items: center; justify-content: center; font-size: 21px;
  box-shadow: 0 0 20px rgba(208,160,48,0.25);
}
#bk-success-msg { font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.65; }
#bk-success-msg strong { color: var(--gold); }

@media (max-width: 480px) {
  .booking-panel { padding: 18px 16px 16px; }
  .booking-panel h3 { font-size: 20px; }
}

</style>
</head>

<body>

<!-- ─── HOME / LANDING PAGE ─── -->
<div id="home-page">
  <div class="top-bar">
    <!-- Admin-managed links (any number, order/labels/content set in the
         admin panel) render here — see renderNavLinks(). -->
    <div id="nav-links" style="display:contents"></div>
    <button class="lang-btn" id="home-lang-btn" onclick="toggleLang()">AR | عربي</button>
  </div>

  <div class="home-center" id="home-center">
    <div class="tagline-wrap">
      <div class="home-welcome" id="home-welcome-text"></div>
    </div>

    <div class="home-tagline" id="home-tagline-text"></div>

    <button class="home-cta" id="home-cta-btn">
      <span id="home-hint-text"></span>
    </button>
    <div class="progress-track"><div class="progress-fill" id="home-progress"></div></div>
  </div>

  <footer id="home-footer"></footer>
</div>

<!-- Nav-link hover/tap preview: dims the page and shows the admin-entered
     content for whichever link is active, until the pointer leaves (or,
     on touch, until the visitor taps the backdrop / close button). -->
<div class="nav-preview-backdrop" id="nav-preview-backdrop">
  <div class="nav-preview-card" id="nav-preview-card">
    <button class="nav-preview-close" id="nav-preview-close" aria-label="Close">✕</button>
    <div class="nav-preview-title" id="nav-preview-title"></div>
    <div class="nav-preview-body" id="nav-preview-body"></div>
    <a class="nav-preview-visit" id="nav-preview-visit" style="display:none" target="_blank" rel="noopener"></a>
  </div>
</div>

<!-- ─── CHAT PAGE ─── -->
<div class="chat-page-logo logo-wrap" id="chat-page-logo-wrap">
  <img class="logo-img" id="logo-en" alt="" style="display:none;">
  <span class="wordmark" id="wordmark-en" style="display:none; font-size:20px;"></span>
  <img class="logo-img" id="logo-ar" alt="" style="display:none;">
  <span class="wordmark" id="wordmark-ar" style="display:none; font-size:20px;"></span>
</div>

<div id="chat-page">
  <div class="top-bar">
    <button class="chip" id="book-btn" onclick="openBooking()" style="white-space:nowrap">💬 <span id="book-btn-label">Talk to Us</span></button>
    <button class="lang-btn" id="lang-btn" onclick="toggleLang()">AR | عربي</button>
  </div>

  <button class="icon-btn back-btn" id="back-btn" onclick="closeChat()" title="Back">←</button>

  <main class="chat-main">
    <div class="inner">

      <div class="tagline-wrap">
        <div class="tagline-main">
          <span id="tagline-line1">Solving Today. </span><span class="gold" id="tagline-line2">Shaping Tomorrow.</span>
        </div>
        <div class="tagline-divider"></div>
        <div class="tagline-sub" id="tagline-sub">AI-POWERED TECHNOLOGY &amp; INNOVATION</div>
      </div>

      <div class="content-wrapper">
        <aside class="faq-sidebar">
          <div class="faq-title" id="faq-title">Quick Questions</div>
          <div class="faq-list" id="faq-list"></div>
        </aside>

        <div class="chat-shell">
          <div class="chat-header">
            <div class="status-dot"></div>
            <p class="chat-header-text" id="chat-header"></p>
            <a class="wa-btn" id="wa-btn" href="#" target="_blank" rel="noopener" style="display:none" title="Chat on WhatsApp">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.13a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.22 8.22 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.25-8.24 2.2 0 4.27.86 5.83 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.55-3.7 8.24-8.25 8.24zm4.52-6.17c-.25-.12-1.47-.72-1.7-.81-.23-.08-.39-.12-.56.13-.17.24-.64.8-.78.97-.14.17-.29.19-.53.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.47-1.38-1.72-.15-.24-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.42.08-.16.04-.31-.02-.43-.06-.12-.56-1.36-.77-1.85-.2-.5-.41-.42-.56-.43-.14 0-.31-.01-.47-.01-.17 0-.43.06-.66.31-.23.24-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.24 3.75.6.25 1.06.4 1.42.52.6.19 1.14.16 1.57.1.48-.07 1.47-.6 1.68-1.18.2-.58.2-1.08.14-1.18-.06-.1-.22-.17-.47-.29z"/></svg>
            </a>
          </div>

          <div class="chat-conversation-wrap">
            <div class="chat-conversation" id="chat-conversation">
              <div class="chat-messages" id="messages" aria-live="polite" aria-relevant="additions"></div>
              <div class="chips" id="chips"></div>
              <div class="chat-input-area">
                <textarea class="chat-input" id="input" rows="1"></textarea>
                <button class="send-btn" id="send-btn" onclick="send()" disabled>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- ─── Talk to Us — lives inside the chat shell itself, synced with the
                 conversation (same session, posts its result back into the transcript) ─── -->
            <div class="booking-panel" id="booking-panel" role="dialog" aria-modal="true" aria-labelledby="bk-title">
              <button class="booking-close" id="booking-close-btn" onclick="closeBooking()" aria-label="Close">✕</button>

              <div class="booking-badge" aria-hidden="true">📅</div>
              <h3 id="bk-title">Talk to Us</h3>
              <p id="bk-sub">Pick a time that works for you — we'll confirm by email.</p>
              <div class="booking-head-divider"></div>

              <div class="bk-tabs" role="tablist">
                <button class="bk-tab active" id="bk-tab-new" onclick="switchBkTab('new')" role="tab" aria-selected="true" aria-controls="bk-new-view">New Appointment</button>
                <button class="bk-tab" id="bk-tab-manage" onclick="switchBkTab('manage')" role="tab" aria-selected="false" aria-controls="bk-manage-view">Manage Booking</button>
              </div>

              <!-- New appointment -->
              <div id="bk-new-view">
                <div class="bk-field">
                  <label id="bk-lbl-date">Date</label>
                  <input type="date" id="bk-date" oninput="loadSlots()">
                </div>
                <div class="bk-field">
                  <label id="bk-lbl-slot">Available times</label>
                  <div class="bk-slots" id="bk-slots"><div class="bk-slots-empty" id="bk-slots-msg">Pick a date to see available times</div></div>
                </div>
                <div class="bk-field"><label id="bk-lbl-name">Name</label><input id="bk-name" type="text" maxlength="120" autocomplete="name"></div>
                <div class="bk-field"><label id="bk-lbl-email">Email</label><input id="bk-email" type="email" autocomplete="email"></div>
                <div class="bk-field"><label id="bk-lbl-phone">Phone (optional)</label><input id="bk-phone" type="tel" autocomplete="tel"></div>
                <div class="bk-field"><label id="bk-lbl-service">What are you interested in? (optional)</label><input id="bk-service" type="text" maxlength="200"></div>
                <div class="bk-field"><label id="bk-lbl-notes">Notes (optional)</label><textarea id="bk-notes" rows="2" maxlength="1000"></textarea></div>

<script>
/* ═══════════════════════════════════════════════════════════
   PERENNIA — HOME PAGE + AI CHAT
   All provider/config/knowledge-base logic lives server-side.
   The browser only ever exchanges chat turns with /api/chat — it
   never sees an API key, provider config, or the raw knowledge base.
═══════════════════════════════════════════════════════════ */

const HOME_TXT = {
  en: { welcome: 'Welcome to Perennia', tagline: 'Visit our V-Lounge for more', hint: 'Start chatting', ourWork: 'Our Work', contactUs: 'Contact Us' },
  ar: { welcome: 'مرحبا بك في بيرينيا', tagline: 'زوروا V-Lounge الخاص بنا لمزيد من المعلومات', hint: 'ابدأ المحادثة', ourWork: 'أعمالنا', contactUs: 'اتصل بنا' }
};

/* ── Brand config: every visible brand string (name, title, footer,
   chat header/greeting/chips, logo alt text) comes from the admin panel
   via /api/landing-config. These are only the pre-fetch fallbacks so the
   page isn't blank for the instant before that request resolves — the
   real values always win once applyBrandConfig() runs. ── */
const DEFAULT_LANDING = {
  'brandName-en': 'Perennia', 'brandName-ar': 'بيرينيا',
  'siteTitle': 'PERENNIA | بيرينيا',
  'metaDescription': 'Perennia — AI-powered technology and innovation.',
  'footerText-en': '© 2026 PERENNIA', 'footerText-ar': '© 2026 بيرينيا',
  'chatHeader-en': "'s AI Assistant — here to help", 'chatHeader-ar': ' الذكي — هنا لمساعدتك',
  'chatGreeting-en': "Hello! I'm {brand}'s AI assistant. Before we get started, may I know your name? It helps us build a good relationship with you and follow up properly.",
  'chatGreeting-ar': 'مرحباً! أنا المساعد الذكي لـ{brand}. قبل أن نبدأ، هل لي أن أعرف اسمك؟ هذا يساعدنا على بناء علاقة أفضل معك ومتابعة طلبك بشكل صحيح.',
  'chatChips-en': ['What does {brand} do?', 'Tell me about your products', 'Which industries do you serve?', 'What makes you different?'],
  'chatChips-ar': ['ماذا تفعل {brand}؟', 'أخبرني عن منتجاتكم', 'ما هي الصناعات التي تخدمونها؟', 'ما الذي يميزكم؟'],
  'sidebarImageAlt-en': 'Perennia Solution', 'sidebarImageAlt-ar': 'حل بيرينيا',
};

function applyBrandConfig(landingIn) {
  const L = Object.assign({}, DEFAULT_LANDING, landingIn || {});
  const brandEn = L['brandName-en'] || 'Perennia';
  const brandAr = L['brandName-ar'] || brandEn;
  const fill = (s, brand) => (s || '').split('{brand}').join(brand);

  document.title = L['siteTitle'] || brandEn;
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute('content', L['metaDescription'] || '');

  // Wordmark fallback text — only ever shown when no logo image exists
  // for that language (see applyLogoVisibility). No hardcoded stylized
  // splitting of the brand name; it's rendered exactly as configured.
  ['home-wordmark-en', 'wordmark-en'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = brandEn; });
  ['home-wordmark-ar', 'wordmark-ar'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = brandAr; });
  document.querySelectorAll('#home-logo-en, #logo-en').forEach(el => { el.alt = brandEn; });
  document.querySelectorAll('#home-logo-ar, #logo-ar').forEach(el => { el.alt = brandAr; });

  const footerTxt = `${L['footerText-en']} · ${L['footerText-ar']}`;
  ['home-footer', 'chat-footer'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = footerTxt; });

  COPY.en.header = ["", brandEn, L['chatHeader-en']];
  // Arabic keeps the original word order ("مساعد <brand> الذكي…"), which
  // needs the brand name in the middle of the phrase rather than the front.
  COPY.ar.header = ['مساعد ', brandAr, L['chatHeader-ar']];
  COPY.en.welcome = fill(L['chatGreeting-en'], brandEn);
  COPY.ar.welcome = fill(L['chatGreeting-ar'], brandAr);
  COPY.en.chips = (L['chatChips-en'] || []).map(c => fill(c, brandEn));
  COPY.ar.chips = (L['chatChips-ar'] || []).map(c => fill(c, brandAr));
  COPY.en.sidebarImageAlt = L['sidebarImageAlt-en'] || brandEn;
  COPY.ar.sidebarImageAlt = L['sidebarImageAlt-ar'] || brandAr;
  COPY.en.aiAvatar = brandEn.charAt(0).toUpperCase();
  COPY.ar.aiAvatar = brandAr.charAt(0);
}

/* ── Logo vs. wordmark: exactly one is ever shown, decided from
   window.hasLogo (computed server-side from what's actually on disk —
   see /api/landing-config), not from an <img> load error alone. This
   also runs on every language toggle so switching languages can't leave
   a stale image visible next to the wordmark or vice-versa. ── */
window.hasLogo = { en: false, ar: false };
// Cache-bust once per page load (not per call) so re-rendering on a
// language toggle doesn't re-fetch the image every time.
window._logoCacheBust = Date.now();

/* ── WhatsApp click-to-chat: shown only if the admin has set a business
   number (see /api/landing-config → contactWhatsapp). The prefilled
   message is language-aware, so this re-runs on every toggleLang() the
   same way applyLogoVisibility() does. ── */
window.contactWhatsapp = '';

function applyWhatsappButton() {
  const btn = document.getElementById('wa-btn');
  if (!btn) return;
  const digits = (window.contactWhatsapp || '').replace(/[^\d]/g, '');
  if (!digits) { btn.style.display = 'none'; return; }
  const preset = lang === 'ar' ? 'مرحباً، أرغب في الاستفسار عن خدماتكم.' : "Hi, I'd like to ask about your services.";
  btn.href = `https://wa.me/${digits}?text=${encodeURIComponent(preset)}`;
  btn.style.display = 'flex';
}

function applyLogoVisibility() {
  ['home-', ''].forEach(prefix => {
    ['en', 'ar'].forEach(code => {
      const img = document.getElementById(prefix + 'logo-' + code);
      const wm = document.getElementById(prefix + 'wordmark-' + code);
      if (!img || !wm) return;
      if (code !== lang) { img.style.display = 'none'; wm.style.display = 'none'; return; }
      if (window.hasLogo[code]) {
        // Set (or refresh) the src with a cache-busting param so a
        // logo uploaded after this tab was first loaded — or a stale
        // cached 404 from before any logo existed — can't leave a
        // broken image in place instead of the real one.
        const wanted = `static/images/logo_${code}.png?v=${window._logoCacheBust}`;
        if (img.getAttribute('src') !== wanted) img.src = wanted;
        img.style.display = 'block';
        wm.style.display = 'none';
      } else {
        img.style.display = 'none';
        wm.style.display = 'block';
      }
    });
  });
}

// ── State ─────────────────────────────────────────────────
const LANG_STORAGE_KEY = 'perennia_lang';

function getInitialLang() {
  // 1) Respect a language the user has explicitly chosen before.
  try {
    const saved = localStorage.getItem(LANG_STORAGE_KEY);
    if (saved === 'en' || saved === 'ar') return saved;
  } catch (e) { /* localStorage unavailable (private mode, etc.) — fall through */ }
  // 2) First visit: default Arabic-locale browsers to Arabic.
  try {
    const nav = (navigator.language || (navigator.languages && navigator.languages[0]) || '').toLowerCase();
    if (nav.startsWith('ar')) return 'ar';
  } catch (e) { /* navigator.language unavailable — fall through */ }
  return 'en';
}

let lang = getInitialLang();
let history = [];
let busy = false;
let aiAvatarSrc = null;
// sessionId used to just be a fresh UUID on every page load — meaning a
// simple refresh looked like a brand-new visitor to the backend (fresh
// interaction stats, fresh lead-capture state) even though nothing about
// the visitor's actual session had changed. Persisted per-tab instead, so
// it stays stable across reloads and only resets when the tab/session
// genuinely ends.
const SESSION_ID_KEY = 'perennia_session_id';
let sessionId = '';
try { sessionId = sessionStorage.getItem(SESSION_ID_KEY) || ''; } catch (e) { /* private mode, etc. */ }
if (!sessionId) {
  sessionId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
  try { sessionStorage.setItem(SESSION_ID_KEY, sessionId); } catch (e) { /* private mode, etc. — non-fatal */ }
}
let chatLocked = false;
// Lead capture now happens conversationally: the assistant itself asks for
// name/email/phone naturally during the chat (see prompt.py), and the
// backend tells us via leadCaptured/leadId/leadName/... on a /api/chat
// response once it's parsed those out of the model's reply. No blocking
// gate/form — these just get filled in as the conversation progresses.
let leadId = '';
let leadCaptured = false;
let leadName = '';
let leadEmail = '';
let leadPhone = '';
try {
  const saved = JSON.parse(sessionStorage.getItem('perennia_lead') || 'null');
  if (saved && saved.leadId) {
    leadId = saved.leadId;
    leadCaptured = true;
    leadName = saved.name || '';
    leadEmail = saved.email || '';
    leadPhone = saved.phone || '';
  }
} catch (e) { /* private mode, etc. — non-fatal; assistant just asks again */ }

// The chat transcript/history used to live only in a JS variable — a
// reload, an accidental back/forward navigation, or the OS reclaiming a
// backgrounded mobile tab wiped the entire conversation, including
// whatever the assistant had already learned about the visitor. Persisted
// per-tab (sessionStorage, not localStorage — a new tab still starts
// fresh) alongside the sessionId above so both survive a reload together.
const HISTORY_KEY = 'perennia_history';
function persistHistory() {
  try { sessionStorage.setItem(HISTORY_KEY, JSON.stringify(history)); } catch (e) { /* private mode, etc. — non-fatal */ }
}
function restoreHistory() {
  try {
    const saved = JSON.parse(sessionStorage.getItem(HISTORY_KEY) || 'null');
    if (Array.isArray(saved) && saved.length) return saved;
  } catch (e) { /* private mode, corrupted value, etc. — non-fatal */ }
  return [];
}
history = restoreHistory();

let chatOpen = false;
let appointmentBooked = false;
let pickedSlot = null;
let autoTransitionTimer = null;

const LEAVE_RE = /\b(bye|goodbye|thanks?,?\s*that'?s\s*all|no\s*thanks|that'?s\s*it|gtg|got\s*to\s*go|see\s*ya)\b|(مع السلامة|شكراً هذا كل شيء|هذا كل شيء|إلى اللقاء)/i;

// ── Detect an admin-uploaded assistant avatar (falls back silently to the letter avatar if none exists) ──
function checkAvatar() {
  return new Promise(resolve => {
    const candidates = ['static/images/ai_avatar.png'];
    let i = 0;
    let settled = false;
    // A stalled/never-responding image request must never block the rest
    // of the app from becoming usable — give up after 3s either way.
    const done = () => { if (!settled) { settled = true; resolve(); } };
    setTimeout(done, 3000);
    const tryNext = () => {
      if (settled) return;
      if (i >= candidates.length) { aiAvatarSrc = null; done(); return; }
      const src = candidates[i++] + '?t=' + Date.now();
      const img = new Image();
      img.onload  = () => { aiAvatarSrc = src; done(); };
      img.onerror = tryNext;
      img.src = src;
    };
    tryNext();
  });
}

// ── Image sidebar rotator — cycles through whichever slides are actually
// available (the hero image only if it loads; the philosophy quotes always,
// since they're built-in text). Keeps the same glass/gold visual language
// throughout so the rotation feels like one coherent piece, not a bolt-on. ──
let slideList = [];
let slideIndex = 0;
let slideTimer = null;
let sidebarImageOk = false;

function initSidebarImage() {
  const img = document.getElementById('sidebar-image');
  if (!img) return;
  const handleLoad = () => { sidebarImageOk = true; buildSlides(); };
  const handleError = () => { sidebarImageOk = false; buildSlides(); };
  img.onload = handleLoad;
  img.onerror = handleError;
  // The <img> has a src set directly in HTML, so it may already have
  // finished (or failed) loading before this listener was attached.
  if (img.complete) { img.naturalWidth > 0 ? handleLoad() : handleError(); }
}

function buildSlides() {
  const sidebar = document.getElementById('image-sidebar');
  if (!sidebar) return;
  slideList = [];
  if (sidebarImageOk) slideList.push('slide-img');
  slideList.push('slide-text-1', 'slide-text-2');
  slideIndex = 0;
  document.querySelectorAll('#slide-frame .slide').forEach(s => s.classList.toggle('active', s.id === slideList[0]));
  renderSlideDots();
  startSlideRotation();
}

function renderSlideDots() {
  const dotsEl = document.getElementById('slide-dots');
  if (!dotsEl) return;
  dotsEl.innerHTML = '';
  if (slideList.length <= 1) return;
  slideList.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'slide-dot' + (i === 0 ? ' active' : '');
    dot.setAttribute('aria-label', `Slide ${i + 1}`);
    dot.onclick = () => { goToSlide(i); startSlideRotation(); };
    dotsEl.appendChild(dot);
  });
}

function goToSlide(i) {
  if (!slideList.length) return;
  slideIndex = ((i % slideList.length) + slideList.length) % slideList.length;
  document.querySelectorAll('#slide-frame .slide').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(slideList[slideIndex]);
  if (el) el.classList.add('active');
  document.querySelectorAll('#slide-dots .slide-dot').forEach((d, idx) => d.classList.toggle('active', idx === slideIndex));
}

function startSlideRotation() {
  clearInterval(slideTimer);
  if (slideList.length <= 1) return;
  slideTimer = setInterval(() => goToSlide(slideIndex + 1), 6000);
}

function startAutoTransition() {
  clearAutoTransition();
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const fill = document.getElementById('home-progress');
  // Users who've asked the OS for reduced motion still land on the chat
  // screen automatically — they just don't get the animated progress
  // bar counting down to it.
  if (!reducedMotion) {
    fill.classList.remove('running');
    // force reflow so the width:0 reset takes effect before we animate again
    void fill.offsetWidth;
    fill.classList.add('running');
  }
  autoTransitionTimer = setTimeout(() => { openChat(); }, 7000);
}

function clearAutoTransition() {
  if (autoTransitionTimer) { clearTimeout(autoTransitionTimer); autoTransitionTimer = null; }
  const fill = document.getElementById('home-progress');
  fill.classList.remove('running');
  fill.style.width = '0%';
}

async function initHome() {
  try {
    // Personalization is optional — never let a slow/hung server block the
    // app. Abort and fall back to defaults if it takes too long.
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    const response = await fetch('/api/landing-config', { signal: controller.signal });
    clearTimeout(timeoutId);
    const data = await response.json();
    if (data.landing) {
      if (data.landing['welcomeText-en']) HOME_TXT.en.welcome = data.landing['welcomeText-en'];
      if (data.landing['welcomeText-ar']) HOME_TXT.ar.welcome = data.landing['welcomeText-ar'];
      if (data.landing['tagline-en']) HOME_TXT.en.tagline = data.landing['tagline-en'];
      if (data.landing['tagline-ar']) HOME_TXT.ar.tagline = data.landing['tagline-ar'];
      window.navLinks = Array.isArray(data.landing['navLinks']) ? data.landing['navLinks'] : [];
      applyBrandConfig(data.landing);
    }
    // Note: booking.promptsEn/Ar are the mid-conversation "want to book a
    // call?" nudges the assistant offers (see bookingPrompts in /api/chat),
    // not the starter suggestion chips — those come from
    // landing.chatChips-en/ar via applyBrandConfig above. Keeping the two
    // separate avoids booking call-to-action sentences showing up as the
    // opening FAQ chips.
    window.hasLogo = { en: !!data.hasLogoEn, ar: !!data.hasLogoAr };
    applyLogoVisibility();
    window.contactWhatsapp = data.contactWhatsapp || '';
    applyWhatsappButton();
  } catch (err) {
    console.log('Using default landing config');
  }
  // Re-render everything (home text + chat chips/etc.) in case
  // personalized copy arrived after the initial render already happened.
  renderUI();
}

// ── Chat page open / close ─────────────────────────────────
function openChat() {
  if (chatOpen) return;
  chatOpen = true;
  clearAutoTransition();
  document.body.classList.add('chat-active');
  document.body.style.overflow = 'hidden';
  const el = document.getElementById('chat-page');
  el.style.display = 'flex';
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('active')));
  setTimeout(() => document.getElementById('input').focus(), 400);
}

function closeChat() {
  chatOpen = false;
  document.body.classList.remove('chat-active');
  document.body.style.overflow = 'auto';
  const el = document.getElementById('chat-page');
  el.classList.remove('active');
  setTimeout(() => { if (!chatOpen) el.style.display = 'none'; }, 400);
  // No auto-transition restart here: the 7s auto-open only ever fires once,
  // on first page load. A user who deliberately closes the chat has made a
  // choice — re-forcing them back in on a timer would override that choice
  // and violates WCAG 2.2.1 (users must control any timed action, not have
  // it repeatedly re-imposed on them).
}

// Close booking panel or chat on ESC (booking panel takes priority since
// it sits on top of the chat — otherwise ESC would close the whole chat
// out from under an open booking form instead of just backing out of it).
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const bookingOpen = document.getElementById('booking-panel').classList.contains('open');
  if (bookingOpen) { closeBooking(); return; }
  if (chatOpen) closeChat();
});

// ── API call — talks only to our own backend at /api/chat. The backend holds the provider, model, and API key. ──
async function callAI(userMessage) {
  // `history` already has this turn's user message optimistically pushed
  // onto it (see sendText) so it renders instantly and survives a reload
  // even if this request fails. Exclude that last entry here since it's
  // sent separately as `message` — otherwise the backend was receiving it
  // twice in a row on every single turn.
  const historyToSend = history.slice(0, -1);
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ lang, message: userMessage, history: historyToSend, sessionId, leadCaptured })
  });
  if (!res.ok) throw new Error(`chat ${res.status}`);
  return res.json();
}

// Applies a lead the backend parsed out of the assistant's reply once it
// naturally gathered name/email/phone during the conversation — no gate,
// no form, just the chat itself. Mirrors what the old gate-submit handler
// used to store, so booking prefill and appointment-linking keep working.
function applyCapturedLead(data) {
  if (!data || !data.leadCaptured || leadCaptured) return;
  leadId = data.leadId || '';
  leadName = data.leadName || '';
  leadEmail = data.leadEmail || '';
  leadPhone = data.leadPhone || '';
  leadCaptured = true;
  try {
    sessionStorage.setItem('perennia_lead', JSON.stringify({
      leadId, name: leadName, email: leadEmail, phone: leadPhone,
    }));
  } catch (e) { /* private mode, etc. — non-fatal */ }
}

// ── Send ──────────────────────────────────────────────────
function setFaqDisabled(disabled) {
  document.querySelectorAll('.faq-item').forEach(btn => btn.disabled = disabled);
}

function lockChat() {
  chatLocked = true;
  const inp = document.getElementById('input');
  inp.disabled = true;
  document.getElementById('send-btn').disabled = true;
  setFaqDisabled(true);
  document.getElementById('chips').innerHTML = '';
}

async function sendText(text) {
  if (busy || chatLocked || !text.trim()) return;
  busy = true;

  const leavingIntent = LEAVE_RE.test(text) && !appointmentBooked && history.length >= 2;

  document.getElementById('chips').innerHTML = '';
  document.getElementById('send-btn').disabled = true;
  setFaqDisabled(true);
  addMsg('user', text);
  history.push({ role: 'user', content: text });
  persistHistory();

  showTyping();
  try {
    const data = await callAI(text);
    hideTyping();
    applyCapturedLead(data);
    const nearLimit = !data.limitReached && data.maxTurns && (data.maxTurns - data.turnsUsed) <= 3;
    addMsg('ai', data.reply, { cta: data.limitReached || nearLimit });
    history.push({ role: 'assistant', content: data.reply });
    persistHistory();

    if (data.limitReached) {
      lockChat();
    } else if (leavingIntent && !nearLimit) {
      setTimeout(() => addMsg('ai', COPY[lang].leavingNudge, { cta: true }), 450);
    }
  } catch(err) {
    hideTyping();
    addMsg('ai', lang === 'ar' ? 'عذراً، حدث خطأ. يرجى المحاولة مرة أخرى.' : 'Sorry, something went wrong. Please try again.');
    console.error(err);
  }

  busy = false;
  if (!chatLocked) {
    setFaqDisabled(false);
    const inp = document.getElementById('input');
    document.getElementById('send-btn').disabled = !inp.value.trim();
    inp.focus();
  }
}

function send() {
  const inp = document.getElementById('input');
  const text = inp.value.trim();
  inp.value = '';
  inp.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  sendText(text);
}

function fmtWhen(iso, label) {
  const dt = new Date(iso);
  const locale = lang === 'ar' ? 'ar' : 'en-US';
  const datePart = dt.toLocaleDateString(locale, { weekday: 'long', month: 'long', day: 'numeric' });
  if (label) return `${datePart} · ${label}`;
  const timePart = dt.toLocaleTimeString(locale, { hour: 'numeric', minute: '2-digit' });
  return `${datePart} · ${timePart}`;
}

function switchBkTab(tab) {
  const newTab = document.getElementById('bk-tab-new');
  const manageTab = document.getElementById('bk-tab-manage');
  newTab.classList.toggle('active', tab === 'new');
  manageTab.classList.toggle('active', tab === 'manage');

// Restores #bk-slots (and #bk-re-slots) to their original placeholder markup —
// undoes the innerHTML replacement loadSlots()/loadRescheduleSlots() does once
// a date is picked, so the panel looks fresh (no stale slots/date left over
// from a previous booking) and #bk-slots-msg/#bk-re-slots-msg exist again for
// bkText() to update next time.
function resetNewApptView() {
  const c = COPY[lang];
  pickedSlot = null;
  document.getElementById('bk-date').value = '';
  document.getElementById('bk-slots').innerHTML = `<div class="bk-slots-empty" id="bk-slots-msg">${c.bkPickDate}</div>`;
  document.getElementById('bk-name').value = '';
  document.getElementById('bk-email').value = '';
  document.getElementById('bk-phone').value = '';
  document.getElementById('bk-service').value = '';
  document.getElementById('bk-notes').value = '';
}

function openBooking() {
  bkText();
  switchBkTab('new');
  document.getElementById('bk-err').textContent = '';
  resetNewApptView();
  // Prefill from whatever the assistant has already gathered conversationally
  // — if the visitor hasn't shared these yet, the fields just start blank
  // and they fill them in here instead.
  if (leadCaptured) {
    document.getElementById('bk-name').value = leadName;
    document.getElementById('bk-email').value = leadEmail;
    document.getElementById('bk-phone').value = leadPhone;
  }
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById('bk-date').min = today;
  document.getElementById('bk-re-date').min = today;
  resetManageView();
  // Remember whatever had focus (the "Talk to Us" chip or CTA button) so
  // closeBooking() can return focus there — otherwise keyboard/screen-reader
  // focus is left on an element that's now hidden behind the panel, or
  // silently reset to <body>.
  bookingOpenerEl = document.activeElement;
  document.getElementById('booking-panel').classList.add('open');
  // Move focus into the panel itself so keyboard and screen-reader users
  // land inside the dialog instead of on a chat message behind it.
  setTimeout(() => document.getElementById('bk-date').focus(), 50);
}

function closeBooking() {
  document.getElementById('booking-panel').classList.remove('open');
  if (bookingOpenerEl && typeof bookingOpenerEl.focus === 'function') bookingOpenerEl.focus();
  bookingOpenerEl = null;
}

async function loadSlots() {
  const c = COPY[lang];
  const date = document.getElementById('bk-date').value;
  const slotsEl = document.getElementById('bk-slots');
  pickedSlot = null;

  slotsEl.innerHTML = `<div class="bk-slots-empty">${c.bkLoading}</div>`;
  try {
    const res = await fetch(`/api/appointments/availability?date=${encodeURIComponent(date)}`);

    const slots = data.slots || [];
    if (!slots.length) { slotsEl.innerHTML = `<div class="bk-slots-empty">${c.bkNoSlots}</div>`; return; }
    slotsEl.innerHTML = '';
    slots.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'bk-slot';
      btn.type = 'button';
      btn.setAttribute('aria-pressed', 'false');
      btn.textContent = s.label;

async function submitBooking() {
  const c = COPY[lang];
  const errEl = document.getElementById('bk-err');
  const name = document.getElementById('bk-name').value.trim();
  const email = document.getElementById('bk-email').value.trim();

  if (!name) { errEl.textContent = c.bkErrName; return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = c.bkErrEmail; return; }
  if (!pickedSlot) { errEl.textContent = c.bkErrSlot; return; }
  errEl.textContent = '';

  const submitBtn = document.getElementById('bk-submit-btn');
  submitBtn.disabled = true;
  submitBtn.textContent = c.bkSubmitting;

  try {
    const res = await fetch('/api/appointments/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name, email,
        phone: document.getElementById('bk-phone').value.trim(),
        service: document.getElementById('bk-service').value.trim(),
        notes: document.getElementById('bk-notes').value.trim(),
        start: pickedSlot.start,
        end: pickedSlot.end,
        lang,
        leadId,
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || c.bkErrGeneric);

    appointmentBooked = true;
    const label = fmtWhen(pickedSlot.start, pickedSlot.label);
    document.getElementById('bk-new-view').style.display = 'none';
    document.getElementById('bk-manage-view').style.display = 'none';
    document.getElementById('bk-success').style.display = 'block';
    document.getElementById('bk-success-msg').innerHTML = c.bkSuccess(label, data.id);

    // Sync the result into the actual conversation, not just the panel.
    addMsg('ai', c.bkSuccess(label, data.id).replace(/<br>/g, '\n'));
  } catch (e) {
    errEl.textContent = e.message || c.bkErrGeneric;
  }
  submitBtn.disabled = false;
  submitBtn.textContent = c.bkSubmit;
}

// ── Manage an existing appointment: lookup, reschedule, cancel ──
function resetManageView() {
  const c = COPY[lang];
  currentManagedAppt = null;
  pickedRescheduleSlot = null;
  document.getElementById('bk-lookup-form').style.display = 'block';
  document.getElementById('bk-manage-details').style.display = 'none';
  document.getElementById('bk-reschedule-panel').style.display = 'none';
  document.getElementById('bk-manage-actions').style.display = 'flex';
  document.getElementById('bk-modify-notice').style.display = 'none';
  document.getElementById('bk-lookup-err').textContent = '';
  document.getElementById('bk-lookup-id').value = '';
  document.getElementById('bk-lookup-email').value = '';
  document.getElementById('bk-re-date').value = '';
  // Same placeholder-restoration as resetNewApptView() — loadRescheduleSlots()
  // wipes #bk-re-slots-msg's parent the first time a reschedule date is
  // picked, so put a fresh placeholder node back.
  document.getElementById('bk-re-slots').innerHTML = `<div class="bk-slots-empty" id="bk-re-slots-msg">${c.bkPickDate}</div>`;
}

async function lookupAppointment() {
  const c = COPY[lang];
  const errEl = document.getElementById('bk-lookup-err');
  const id = document.getElementById('bk-lookup-id').value.trim();
  const email = document.getElementById('bk-lookup-email').value.trim();
  if (!id || !email) { errEl.textContent = c.bkLookupErrRequired; return; }
  errEl.textContent = '';

  const btn = document.getElementById('bk-lookup-btn');
  btn.disabled = true;
  try {
    const res = await fetch(`/api/appointments/lookup?id=${encodeURIComponent(id)}&email=${encodeURIComponent(email)}`);
    if (res.status === 404) { errEl.textContent = c.bkLookupErrNotFound; btn.disabled = false; return; }
    if (!res.ok) throw new Error();
    const data = await res.json();
    currentManagedAppt = data;

    document.getElementById('bk-appt-summary').innerHTML = c.apptSummary(data);
    const notice = document.getElementById('bk-modify-notice');
    const actions = document.getElementById('bk-manage-actions');
    if (data.status === 'cancelled') {
      notice.style.display = 'none';
      actions.style.display = 'none';
    } else if (!data.canModify) {
      notice.textContent = c.bkModifyBlocked(data.minNoticeHours);
      notice.style.display = 'block';
      actions.style.display = 'none';
    } else {
      notice.style.display = 'none';
      actions.style.display = 'flex';
    }

    document.getElementById('bk-lookup-form').style.display = 'none';
    document.getElementById('bk-manage-details').style.display = 'block';
  } catch {
    errEl.textContent = c.bkLookupErrGeneric;
  }
  btn.disabled = false;
}

async function submitReschedule() {
  const c = COPY[lang];
  const errEl = document.getElementById('bk-re-err');

      })

    document.getElementById('bk-manage-view').style.display = 'none';
    document.getElementById('bk-success').style.display = 'block';

async function requestCancelAppointment() {
  const c = COPY[lang];
  if (!currentManagedAppt) return;
  if (!window.confirm(c.bkCancelConfirm)) return;

  const btn = document.getElementById('bk-cancel-appt-btn');
  btn.disabled = true;
  try {
    const res = await fetch('/api/appointments/cancel-request', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: currentManagedAppt.id,
        email: document.getElementById('bk-lookup-email').value.trim() || currentManagedAppt.email,
      })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || c.bkErrGeneric);

    const label = fmtWhen(currentManagedAppt.start);
    document.getElementById('bk-manage-view').style.display = 'none';
    document.getElementById('bk-success').style.display = 'block';
    document.getElementById('bk-success-msg').innerHTML = c.bkCancelSuccess(label, data.id);
    addMsg('ai', c.bkCancelSuccess(label, data.id).replace(/<br>/g, '\n'));
  } catch (e) {
    document.getElementById('bk-modify-notice').textContent = e.message || c.bkErrGeneric;
    document.getElementById('bk-modify-notice').style.display = 'block';
  }
  btn.disabled = false;
}

// ── Init ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Core UI comes up immediately with default copy — the chat must be fully
  // usable even if the network is slow, offline, or a backend call hangs.
  applyBrandConfig(null); // fills title/footer/wordmark/header/chips/etc. with defaults; real config overwrites these once initHome()'s fetch resolves
  initSidebarImage();
  renderUI();
  // If we restored a transcript from this tab's earlier session (see
  // restoreHistory() above), replay it into the chat instead of starting
  // over with the generic greeting — a reload should feel like reopening
  // the conversation, not losing it.
  if (history.length) {
    history.forEach(turn => addMsg(turn.role === 'assistant' ? 'ai' : 'user', turn.content));
  } else {
    addMsg('ai', COPY[lang].welcome);
  }

  const inp = document.getElementById('input');
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 130) + 'px';
    document.getElementById('send-btn').disabled = !inp.value.trim() || busy;
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  // Home → Chat auto-transition after 7 seconds (cancelled by manual open)
  startAutoTransition();

  // Personalization (assistant avatar, admin-customized landing copy) loads
  // in the background and re-renders in place when/if it arrives — it never
  // blocks or delays the app becoming usable.
  checkAvatar().then(() => {
    // If a custom avatar loaded after the welcome message already rendered
    // with the fallback letter avatar, swap it in on any AI bubbles shown so far.
    if (aiAvatarSrc) {
      document.querySelectorAll('.msg.ai .avatar').forEach(av => { av.innerHTML = avatarInner('ai'); });
    }
  });
  initHome();
});
</script>
