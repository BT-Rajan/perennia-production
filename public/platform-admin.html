<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform Admin</title>
<style>
  :root { --accent: #3f5db5; --bg: #f5f6fa; --card: #ffffff; --border: #dfe3ec; --text: #20242c; --muted: #767c8a; --warn: #b5762f; --danger: #b53f3f; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  #login-screen { max-width: 320px; margin: 80px auto; padding: 24px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); }
  #login-screen input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; }
  #login-screen button, .primary { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; }
  #app { display: none; max-width: 820px; margin: 0 auto; padding: 16px; }
  h2 { font-size: 16px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; background: #eef0f6; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover { background: #f7f8fc; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #e6ebf9; color: var(--accent); }
  .tag.warn { background: #fbeee0; color: var(--warn); }
  .tag.danger { background: #fbe3e3; color: var(--danger); }
  .back { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 13px; margin-bottom: 10px; padding: 0; }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  nav button { padding: 8px 12px; border: none; background: none; cursor: pointer; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .toggle { width: 36px; height: 20px; border-radius: 10px; position: relative; cursor: pointer; border: none; }
  .toggle.on { background: #3f9a5d; }
  .toggle.off { background: #d7dae2; }
  .toggle .knob { width: 16px; height: 16px; background: white; border-radius: 50%; position: absolute; top: 2px; transition: left 0.15s; }
  .toggle.on .knob { left: 18px; }
  .toggle.off .knob { left: 2px; }
  .flag-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .error { color: var(--danger); font-size: 13px; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="login-screen">
  <h3>Platform admin sign in</h3>
  <input id="login-username" placeholder="Username">
  <input id="login-password" type="password" placeholder="Password">
  <div class="error" id="login-error"></div>
  <button onclick="doLogin()">Sign in</button>
</div>

<div id="app">
  <h2>Platform Admin</h2>
  <div id="view"></div>
</div>

<script>
async function doLogin() {
  const username = document.getElementById('login-username').value;
  const password = document.getElementById('login-password').value;
  const resp = await fetch('/api/admin/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username, password }),
  });
  if (!resp.ok) {
    document.getElementById('login-error').textContent = 'Incorrect username or password.';
    return;
  }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  showTenantsList();
}

async function api(path, opts = {}) {
  const resp = await fetch(path, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (resp.status === 401) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('login-error').textContent = 'Session expired — please sign in again.';
    throw new Error('unauthenticated');
  }
  return resp;
}

function statusTag(status) {
  const cls = status === 'active' ? '' : (status === 'provisioning_failed' ? 'danger' : 'warn');
  return `<span class="tag ${cls}">${status}</span>`;
}

async function showTenantsList() {
  const view = document.getElementById('view');
  view.innerHTML = '<p>Loading…</p>';
  const resp = await api('/api/platform/tenants');
  const tenants = await resp.json();
  view.innerHTML = `
    <div class="panel">
      <h3>Tenants <span style="color:var(--muted); font-weight:400;">(${tenants.length})</span></h3>
      <table>
        <thead><tr><th>Business</th><th>Subdomain</th><th>Plan</th><th>Status</th><th>Created</th></tr></thead>
        <tbody>
          ${tenants.map(t => `<tr class="clickable" onclick="showTenantDetail(${t.id})">
            <td>${t.business_name}</td><td>${t.subdomain}</td><td>${t.plan_tier}</td>
            <td>${statusTag(t.status)}</td><td>${new Date(t.created_at).toLocaleDateString()}</td>
          </tr>`).join('') || '<tr><td colspan="5">No tenants provisioned yet.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}

async function showTenantDetail(tenantId) {
  const view = document.getElementById('view');
  view.innerHTML = '<p>Loading…</p>';
  const resp = await api(`/api/platform/tenants/${tenantId}`);
  const t = await resp.json();
  view.innerHTML = `
    <button class="back" onclick="showTenantsList()">&larr; Back to tenants</button>
    <h3>${t.business_name} <span style="color:var(--muted); font-weight:400;">${t.subdomain}.perennia.app</span></h3>
    <nav>
      <button class="active" data-tab="overview">Overview</button>
      <button data-tab="flags">Feature Flags</button>
    </nav>
    <div id="tenant-tab-content"></div>
  `;
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (btn.dataset.tab === 'overview') renderOverview(t);
      else renderFlags(t);
    });
  });
  renderOverview(t);
}

function renderOverview(t) {
  document.getElementById('tenant-tab-content').innerHTML = `
    <div class="panel">
      <table>
        <tr><td style="color:var(--muted); width:160px;">Status</td><td>${statusTag(t.status)}</td></tr>
        <tr><td style="color:var(--muted);">Plan tier</td><td>${t.plan_tier}</td></tr>
        <tr><td style="color:var(--muted);">Database</td><td><code>${t.db_name}</code></td></tr>
        <tr><td style="color:var(--muted);">Created</td><td>${new Date(t.created_at).toLocaleString()}</td></tr>
      </table>
      <p style="font-size:12px; color:var(--muted); margin-top:10px;">
        Billing and full audit-log tabs are deliberately not shown here — deferred until tenant volume or a real need justifies the screen (docs/06 Pass 6).
      </p>
    </div>
  `;
}

function renderFlags(t) {
  const view = document.getElementById('tenant-tab-content');
  view.innerHTML = `
    <div class="panel">
      <h3>Feature Flags <span style="color:var(--muted); font-weight:400;">— ${t.plan_tier} plan entitlements</span></h3>
      ${t.feature_flags.map(f => `
        <div class="flag-row">
          <span>${f.key}</span>
          <button class="toggle ${f.enabled ? 'on' : 'off'}" onclick="toggleFlag(${t.id}, '${f.key}', ${!f.enabled})"><span class="knob"></span></button>
        </div>
      `).join('') || '<p>No entitled flags for this plan tier.</p>'}
    </div>
  `;
}

async function toggleFlag(tenantId, key, newValue) {
  const resp = await api(`/api/platform/tenants/${tenantId}/flags/${key}?enabled=${newValue}`, { method: 'POST' });
  if (resp.ok) showTenantDetail(tenantId);
}
</script>
</body>
</html>
