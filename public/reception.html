<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reception</title>
<style>
  :root { --accent: #b5763f; --bg: #faf7f4; --card: #ffffff; --border: #e6ddd3; --text: #2a2420; --muted: #8a7f74; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  #app { max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--card); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: #f1e4d6; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--accent); }
  header .title { font-weight: 600; font-size: 15px; }
  header .status { font-size: 12px; color: #3a8a4a; }
  header select { margin-left: auto; font-size: 12px; }
  #thread { flex: 1; padding: 16px; overflow-y: auto; }
  .bubble { background: #f5f0ea; border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; max-width: 85%; font-size: 14px; line-height: 1.5; }
  .bubble.user { background: var(--accent); color: white; margin-left: auto; }
  .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .quick-actions button { padding: 12px 8px; border: 1px solid var(--border); background: white; border-radius: 10px; font-size: 12px; cursor: pointer; }
  .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .cards button.card { text-align: left; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: white; cursor: pointer; font-size: 13px; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .slots button { padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: white; cursor: pointer; font-size: 13px; }
  .summary { border-top: 1px solid var(--border); padding-top: 12px; font-size: 13px; }
  .summary .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #composer input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 14px; }
  #composer button { width: 40px; height: 40px; border-radius: 50%; border: none; background: var(--accent); color: white; cursor: pointer; }
  .primary { width: 100%; padding: 12px; border: none; background: var(--accent); color: white; border-radius: 10px; font-size: 14px; cursor: pointer; }
  .muted { color: var(--muted); font-size: 11px; text-align: center; margin-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar" id="avatar">?</div>
    <div>
      <div class="title" id="biz-name">Loading…</div>
      <div class="status">● Open</div>
    </div>
    <select id="lang-select">
      <option value="en">EN</option>
      <option value="ar">ع</option>
    </select>
  </header>

  <div id="thread"></div>

  <div id="composer">
    <input id="msg-input" type="text" placeholder="Or just type your question…">
    <button id="send-btn">↑</button>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
// Dev/Pass-2: tenant chosen via ?tenant=; production uses Host-based
// subdomain resolution instead (see app/main.py serve_reception()).
const TENANT = params.get('tenant') || 'glowspa';
const API = (path) => fetch(path, {
  headers: { 'X-Tenant-Subdomain': TENANT, 'Content-Type': 'application/json' },
});

let conversationId = null;
let language = 'en';
let bookingState = null; // { serviceId, staffId, startIso, ... } as the flow progresses

const thread = document.getElementById('thread');

function addBubble(text, who) {
  const el = document.createElement('div');
  el.className = 'bubble' + (who === 'user' ? ' user' : '');
  el.textContent = text;
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el;
}

function addCardsBlock(render) {
  const el = document.createElement('div');
  render(el);
  thread.appendChild(el);
  thread.scrollTop = thread.scrollHeight;
  return el;
}

async function init() {
  const resp = await API(`/api/tenant/reception/services`);
  if (resp.ok) {
    document.getElementById('biz-name').textContent = TENANT; // Pass 2: no public tenant-name endpoint yet
    document.getElementById('avatar').textContent = TENANT.slice(0, 2).toUpperCase();
  }
  addBubble("Hi! I'm here to help you book, or answer any questions. What can I do for you?", 'assistant');
  addCardsBlock((el) => {
    el.className = 'quick-actions';
    el.innerHTML = `
      <button data-action="book">📅 Book now</button>
      <button data-action="services">📋 Services & prices</button>
      <button data-action="hours">📍 Location & hours</button>
      <button data-action="human">🎧 Talk to someone</button>
    `;
    el.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => handleQuickAction(btn.dataset.action)));
  });
}

async function handleQuickAction(action) {
  if (action === 'book') return startBookingFlow();
  if (action === 'services') return showServices();
  if (action === 'human') return sendMessage("I'd like to talk to a person, please.");
  if (action === 'hours') return sendMessage('What are your hours and location?');
}

async function showServices() {
  const resp = await API('/api/tenant/reception/services');
  const services = await resp.json();
  addBubble('Here’s what we offer:', 'assistant');
  addCardsBlock((el) => {
    el.className = 'cards';
    services.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'card';
      btn.textContent = `${s.name} — ${s.duration_minutes}min, ${s.price} KD`;
      btn.addEventListener('click', () => startBookingFlow(s.id));
      el.appendChild(btn);
    });
  });
}

async function startBookingFlow(serviceId) {
  bookingState = { serviceId };
  const resp = await API('/api/tenant/reception/services');
  const services = await resp.json();
  if (!serviceId) {
    addBubble('Sure — what would you like to book?', 'assistant');
    addCardsBlock((el) => {
      el.className = 'cards';
      services.forEach(s => {
        const btn = document.createElement('button');
        btn.className = 'card';
        btn.textContent = `${s.name} (${s.duration_minutes}min)`;
        btn.addEventListener('click', () => pickStaffFor(s.id));
        el.appendChild(btn);
      });
    });
  } else {
    pickStaffFor(serviceId);
  }
}

async function pickStaffFor(serviceId) {
  bookingState = { serviceId };
  const resp = await API(`/api/tenant/reception/staff?service_id=${serviceId}`);
  const staff = await resp.json();
  if (staff.length === 0) {
    addBubble("Sorry, no one is available for that service right now — let me connect you with the team.", 'assistant');
    return;
  }
  addBubble('Who would you like to see?', 'assistant');
  addCardsBlock((el) => {
    el.className = 'cards';
    staff.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'card';
      btn.textContent = s.name + (s.gender ? ` (${s.gender})` : '');
      btn.addEventListener('click', () => pickSlotFor(serviceId, s.id));
      el.appendChild(btn);
    });
  });
}

async function pickSlotFor(serviceId, staffId) {
  bookingState = { serviceId, staffId };
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  const dateStr = tomorrow.toISOString().slice(0, 10);
  const resp = await API(`/api/tenant/reception/availability?staff_id=${staffId}&service_id=${serviceId}&date=${dateStr}`);
  const { slots } = await resp.json();
  if (!slots.length) {
    addBubble('No open times tomorrow — let me connect you with the team to find something that works.', 'assistant');
    return;
  }
  addBubble('Here are the open times tomorrow:', 'assistant');
  addCardsBlock((el) => {
    el.className = 'slots';
    slots.slice(0, 6).forEach(slot => {
      const btn = document.createElement('button');
      const t = new Date(slot.start);
      btn.textContent = t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      btn.addEventListener('click', () => confirmBookingSummary(serviceId, staffId, slot.start));
      el.appendChild(btn);
    });
  });
}

async function confirmBookingSummary(serviceId, staffId, startIso) {
  bookingState = { serviceId, staffId, startIso };
  addCardsBlock((el) => {
    el.className = 'summary';
    el.innerHTML = `
      <div class="row"><span>Confirm booking</span></div>
      <button class="primary" id="pay-btn">Pay deposit and confirm</button>
      <div class="muted">Remaining balance due at your appointment</div>
    `;
    el.querySelector('#pay-btn').addEventListener('click', submitBooking);
  });
}

async function submitBooking() {
  const phone = prompt('Your phone number, so we can confirm your booking:');
  if (!phone) return;
  const resp = await fetch('/api/tenant/reception/booking', {
    method: 'POST',
    headers: { 'X-Tenant-Subdomain': TENANT, 'Content-Type': 'application/json' },
    body: JSON.stringify({
      customer_phone: phone, staff_id: bookingState.staffId,
      service_id: bookingState.serviceId, start_iso: bookingState.startIso,
      language,
    }),
  });
  const body = await resp.json();
  if (!resp.ok) {
    addBubble('Sorry, that time is no longer available — want to try another?', 'assistant');
    return;
  }
  if (body.status === 'pending_deposit') {
    // Pass 2: no live payment gateway wired in — this simulates the
    // provider webhook a real KNET/Stripe integration would call.
    const confirmResp = await fetch(`/api/tenant/reception/booking/${body.appointment_id}/confirm-deposit`, {
      method: 'POST',
      headers: { 'X-Tenant-Subdomain': TENANT, 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider_ref: 'dev-simulated' }),
    });
    if (confirmResp.ok) {
      addBubble("You're all set — your appointment is confirmed!", 'assistant');
    }
  } else {
    addBubble("You're all set — your appointment is confirmed!", 'assistant');
  }
}

async function sendMessage(text) {
  if (!text) return;
  addBubble(text, 'user');
  const resp = await fetch('/api/tenant/reception/chat', {
    method: 'POST',
    headers: { 'X-Tenant-Subdomain': TENANT, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text, conversation_id: conversationId, language }),
  });
  if (!resp.ok) {
    addBubble("Sorry, I'm having trouble right now — please try again in a moment.", 'assistant');
    return;
  }
  const body = await resp.json();
  conversationId = body.conversation_id;
  addBubble(body.reply, 'assistant');
}

document.getElementById('send-btn').addEventListener('click', () => {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  input.value = '';
  sendMessage(text);
});
document.getElementById('msg-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('send-btn').click();
});
document.getElementById('lang-select').addEventListener('change', (e) => {
  language = e.target.value;
  document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = language;
});

init();
</script>
</body>
</html>
